# Deletes a pull request's Actions caches when it closes, and a branch's when it is
# deleted. See https://repo.dotify.biz/one/engineering-system/docs/standards/github-actions.md#caching
name: Cache cleanup

on:
  pull_request:
    types: [closed]
  delete:

permissions:
  actions: write

jobs:
  cleanup:
    uses: DotifyBIZ/one-engineering-system/.github/workflows/cache-cleanup.yml@main
